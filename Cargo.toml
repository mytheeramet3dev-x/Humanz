[package]
name = "humanz"
version = "0.1.0"
edition = "2021"
description = "HumanZ: Whole-Body Multi-Organ Negligible Senescence & Autonomous Rejuvenation Digital Twin Platform."
license = "MIT"

[dependencies]
scies-bio-th = { path = "../scies-bio-th", version = "1.0", features = ["serde", "experimental", "epigenome", "stats", "regulatory", "multiomics", "safety", "singlecell", "pharma", "imaging", "aging"] }
scies-bio-sim = { path = "../scies-bio-sim", version = "1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
